# ====================================================================
# PTP4L Configuration: Grandmaster Clock Node (Proxmox / Primary Reference)
# Author: Glaciojtp (@Glaciojtp)
# Standard: IEEE 1588v2-2008 (Default E2E Profile)
# ====================================================================

[global]
# IEEE 1588 Best Master Clock Algorithm (BMCA) Priority
# Lower value = higher priority. 127 guarantees master election over standard clients (255)
priority1               127
priority2               127
clockClass              6
clockAccuracy           0x21
offsetScaledLogVariance 0x4e5d
domainNumber            0
free_running            0
freq_est_interval       1

# Force this node to act strictly as Master
masterOnly              1

# Network Transport: UDP/IPv4 Multicast (224.0.1.129 / 224.0.1.130)
network_transport       UDPv4
delay_mechanism         E2E

# High-frequency packet intervals (log2 seconds):
# -3 = 2^(-3) = 1/8s = 8 Sync packets per second (High-Resolution HFT Profile)
logSyncInterval         -3
logMinDelayReqInterval  -3
logAnnounceInterval     1
announceReceiptTimeout  3

# Differentiated Services Code Point (DSCP) QoS prioritization:
# DSCP 46 = Expedited Forwarding (EF) for PTP event packets (UDP 319)
dscp_event              46
dscp_general            0

# Timestamping mode: software (default/portable fallback) or hardware (NIC PHC)
time_stamping           software

# UNIX Domain Socket for PMC (PTP Management Client) and Prometheus Exporter
uds_address             /var/run/ptp4l
summary_interval        1
verbose                 1

# Default network interface section (override on CLI via -i <interface>)
[eth0]
