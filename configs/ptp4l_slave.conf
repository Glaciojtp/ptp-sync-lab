# ====================================================================
# PTP4L Configuration: Slave Clock Node (PC Principal / Trading Engine)
# Author: Glaciojtp (@Glaciojtp)
# Standard: IEEE 1588v2-2008 (Default E2E Profile)
# ====================================================================

[global]
# Restrict this node to act strictly as Slave (never transition to Master)
slaveOnly               1
priority1               255
priority2               255
domainNumber            0

# Network Transport: UDP/IPv4 Multicast
network_transport       UDPv4
delay_mechanism         E2E

# High-frequency packet intervals (log2 seconds):
logSyncInterval         -3
logMinDelayReqInterval  -3

# Clock Servo PI (Proportional-Integral) loop tuning:
# Step the clock immediately if offset exceeds 20 microseconds on startup
step_threshold          0.00002
first_step_threshold    0.00002

# Maximum frequency offset in parts per billion
max_frequency           900000000

# Timestamping mode: software (default/portable fallback) or hardware
time_stamping           software

# UNIX Domain Socket for PMC & Prometheus Exporter
uds_address             /var/run/ptp4l
summary_interval        1
verbose                 1

# Default network interface section (override on CLI via -i <interface>)
[eth0]
